<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-label="Profile footer">
  <defs>
    <linearGradient id="fbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042F2E"/>
      <stop offset="50%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="waveA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#14B8A6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="waveB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="fg" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0B1220" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#94A3B8" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1200" height="180" fill="url(#fbg)"/>
  <rect width="1200" height="180" fill="url(#dots)"/>
  <ellipse cx="600" cy="0" rx="420" ry="90" fill="url(#fg)"/>

  <path d="M0 70 C150 20 280 110 450 60 C620 10 780 95 960 50 C1080 20 1140 55 1200 40 L1200 180 L0 180 Z" fill="url(#waveB)"/>
  <path d="M0 95 C180 45 300 130 480 85 C680 30 820 120 1000 75 C1100 50 1160 80 1200 70 L1200 180 L0 180 Z" fill="url(#waveA)" opacity="0.55"/>

  <!-- constellation -->
  <g stroke="#67E8F9" stroke-opacity="0.35" stroke-width="1">
    <path d="M120 48 L180 28 L240 52 L300 24"/>
    <path d="M880 30 L940 48 L1000 22 L1060 44"/>
  </g>
  <g fill="#A5F3FC">
    <circle cx="120" cy="48" r="2.8"/><circle cx="180" cy="28" r="3.2"/><circle cx="240" cy="52" r="2.5"/>
    <circle cx="300" cy="24" r="3"/><circle cx="880" cy="30" r="2.8"/><circle cx="940" cy="48" r="3"/>
    <circle cx="1000" cy="22" r="2.5"/><circle cx="1060" cy="44" r="3.2"/>
  </g>

  <text x="600" y="118" text-anchor="middle" fill="#E2E8F0" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="22" font-weight="700">Thanks for stopping by</text>
  <text x="600" y="146" text-anchor="middle" fill="#94A3B8" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="14">Let's build something solid · Anisul Haque Niloy</text>
</svg>
