  <ellipse cx="820" cy="90" rx="260" ry="140" fill="url(#glowR)"/>
  <ellipse cx="160" cy="230" rx="220" ry="120" fill="url(#glowL)"/>
  <path d="M0 220 C180 160 340 270 520 210 C720 140 860 250 1000 180 L1000 300 L0 300 Z" fill="url(#aurora)" opacity="0.55"/>
  <circle cx="120" cy="40" r="2.2" fill="#E9D5FF" opacity="0.9"/><circle cx="210" cy="70" r="1.8" fill="#E9D5FF" opacity="0.45"/><circle cx="320" cy="36" r="2.6" fill="#E9D5FF" opacity="0.9"/><circle cx="450" cy="55" r="1.6" fill="#E9D5FF" opacity="0.45"/><circle cx="160" cy="250" r="2" fill="#E9D5FF" opacity="0.9"/><circle cx="380" cy="270" r="1.7" fill="#E9D5FF" opacity="0.45"/><circle cx="70" cy="180" r="1.5" fill="#E9D5FF" opacity="0.9"/>

