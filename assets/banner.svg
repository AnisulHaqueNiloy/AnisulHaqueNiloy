<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Anisul Haque Niloy coding banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#042F2E"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#14B8A6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="60%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="40%" r="38%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0B1220" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="15%" cy="75%" r="30%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0B1220" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#94A3B8" stroke-width="0.55" stroke-opacity="0.11"/>
    </pattern>
    <clipPath id="termClip"><rect x="730" y="42" width="420" height="250" rx="16"/></clipPath>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <ellipse cx="960" cy="120" rx="280" ry="150" fill="url(#glow)"/>
  <ellipse cx="160" cy="280" rx="220" ry="120" fill="url(#glow2)"/>
  <path d="M0 230 C200 170 340 280 520 220 C720 150 880 260 1200 190 L1200 360 L0 360 Z" fill="url(#aurora)" opacity="0.32"/>

  <!-- floating code rain -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#22D3EE" opacity="0.18">
    <text x="520" y="40">const</text><text x="560" y="58">await</text><text x="540" y="76">=&gt;</text>
    <text x="610" y="50">{ }</text><text x="640" y="70">npm</text><text x="600" y="90">git</text>
    <text x="500" y="110">&lt;/&gt;</text><text x="650" y="110">API</text>
    <text x="520" y="130">JWT</text><text x="580" y="150">CRUD</text>
    <text x="630" y="170">SQL</text><text x="500" y="170">useState</text>
  </g>

  <!-- left identity -->
  <text x="48" y="96" fill="#67E8F9" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="14" letter-spacing="3.5" font-weight="700">FULL-STACK DEVELOPER</text>
  <text x="48" y="150" fill="url(#titleGrad)" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="48" font-weight="800">Anisul Haque Niloy</text>
  <text x="48" y="188" fill="#94A3B8" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="16">Shipping MERN products · Exploring ASP.NET Core &amp; PostgreSQL</text>
  <path d="M48 210 L270 210" stroke="url(#beam)" stroke-width="3" stroke-linecap="round"/>

  <g font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12" font-weight="700">
    <rect x="48" y="228" width="92" height="28" rx="14" fill="#0EA5E9" fill-opacity="0.18" stroke="#38BDF8" stroke-opacity="0.55"/>
    <text x="94" y="246" text-anchor="middle" fill="#7DD3FC">Softvence</text>
    <rect x="150" y="228" width="78" height="28" rx="14" fill="#14B8A6" fill-opacity="0.18" stroke="#2DD4BF" stroke-opacity="0.55"/>
    <text x="189" y="246" text-anchor="middle" fill="#99F6E4">Dhaka BD</text>
    <rect x="238" y="228" width="110" height="28" rx="14" fill="#F97316" fill-opacity="0.16" stroke="#FB923C" stroke-opacity="0.55"/>
    <text x="293" y="246" text-anchor="middle" fill="#FDBA74">Open to Work</text>
  </g>

  <!-- mini file tree card -->
  <g>
    <rect x="48" y="274" width="300" height="62" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
    <text x="64" y="296" fill="#64748B" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">~/projects</text>
    <text x="64" y="318" fill="#34D399" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">▸ wtapphub/</text>
    <text x="170" y="318" fill="#38BDF8" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">▸ ecommerce/</text>
    <text x="290" y="318" fill="#FBBF24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">▸ api/</text>
  </g>

  <!-- big terminal -->
  <g>
    <rect x="730" y="42" width="420" height="276" rx="16" fill="#020617" stroke="#334155" stroke-width="1.5"/>
    <rect x="730" y="42" width="420" height="36" rx="16" fill="#111827"/>
    <rect x="730" y="62" width="420" height="16" fill="#111827"/>
    <circle cx="754" cy="60" r="5" fill="#F87171"/>
    <circle cx="772" cy="60" r="5" fill="#FBBF24"/>
    <circle cx="790" cy="60" r="5" fill="#34D399"/>
    <text x="818" y="64" fill="#64748B" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">anisul@dev:~/stack — zsh</text>

    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">
      <text x="752" y="104"><tspan fill="#34D399">➜</tspan><tspan fill="#38BDF8"> ~ </tspan><tspan fill="#E2E8F0">npx create-app@latest</tspan></text>
      <text x="752" y="128" fill="#94A3B8">✔ Framework: React + TypeScript</text>
      <text x="752" y="152" fill="#94A3B8">✔ Backend: Node / Express / Mongo</text>
      <text x="752" y="176"><tspan fill="#34D399">➜</tspan><tspan fill="#38BDF8"> ~ </tspan><tspan fill="#E2E8F0">code .</tspan></text>
      <text x="752" y="208" fill="#64748B">// shipping production-ready APIs</text>
      <text x="752" y="232"><tspan fill="#38BDF8">const</tspan><tspan fill="#E2E8F0"> stack = [</tspan><tspan fill="#34D399">"MERN"</tspan><tspan fill="#E2E8F0">, </tspan><tspan fill="#FBBF24">"RTK"</tspan><tspan fill="#E2E8F0">]</tspan></text>
      <text x="752" y="256"><tspan fill="#38BDF8">await</tspan><tspan fill="#E2E8F0"> explore(</tspan><tspan fill="#22D3EE">"ASP.NET + EF Core"</tspan><tspan fill="#E2E8F0">)</tspan></text>
      <text x="752" y="286"><tspan fill="#34D399">➜</tspan><tspan fill="#38BDF8"> ~ </tspan><tspan fill="#E2E8F0">git push origin main</tspan><tspan fill="#67E8F9"> ▍</tspan></text>
    </g>
  </g>

  <!-- floating badges near terminal -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="700">
    <rect x="690" y="300" width="70" height="24" rx="8" fill="#0EA5E9" fill-opacity="0.25" stroke="#38BDF8"/>
    <text x="725" y="316" text-anchor="middle" fill="#7DD3FC">React</text>
    <rect x="770" y="300" width="70" height="24" rx="8" fill="#339933" fill-opacity="0.25" stroke="#4ADE80"/>
    <text x="805" y="316" text-anchor="middle" fill="#86EFAC">Node</text>
    <rect x="850" y="300" width="78" height="24" rx="8" fill="#512BD4" fill-opacity="0.28" stroke="#A78BFA"/>
    <text x="889" y="316" text-anchor="middle" fill="#DDD6FE">.NET</text>
    <rect x="938" y="300" width="78" height="24" rx="8" fill="#4169E1" fill-opacity="0.28" stroke="#93C5FD"/>
    <text x="977" y="316" text-anchor="middle" fill="#BFDBFE">Postgres</text>
  </g>
</svg>
