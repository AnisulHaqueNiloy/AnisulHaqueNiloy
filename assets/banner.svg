  <text x="568" y="92" font-family="Consolas, Menlo, monospace" font-size="13"><tspan fill="#C084FC">➜</tspan><tspan fill="#A78BFA"> ~ </tspan><tspan fill="#F5F3FF">npx create-stack@latest</tspan></text><text x="568" y="116" font-family="Consolas, Menlo, monospace" font-size="13" fill="#C4B5FD">✔ React + TypeScript locked in</text><text x="568" y="140" font-family="Consolas, Menlo, monospace" font-size="13" fill="#C4B5FD">✔ Node / Express / MongoDB</text><text x="568" y="164" font-family="Consolas, Menlo, monospace" font-size="13" fill="#DDD6FE">const craft = ["UI", "API", "DB"]</text><text x="568" y="188" font-family="Consolas, Menlo, monospace" font-size="13" fill="#DDD6FE">await explore("ASP.NET + EF Core")</text><text x="568" y="212" font-family="Consolas, Menlo, monospace" font-size="13"><tspan fill="#C084FC">➜</tspan><tspan fill="#A78BFA"> ~ </tspan><tspan fill="#F5F3FF">git push origin main ✦</tspan><tspan fill="#E9D5FF">▍</tspan></text>

