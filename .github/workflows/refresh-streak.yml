name: Refresh GitHub Streak

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  refresh-streak:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch streak card
        run: |
          set -e
          URL='https://streak-stats.demolab.com/?user=AnisulHaqueNiloy&theme=dark&hide_border=true&background=0E1624&ring=C2A46B&fire=E2D3A8&currStreakLabel=C2A46B&sideLabels=C5D0DC&dates=8FA3B8'
          curl -fsSL --retry 5 --retry-delay 5 --max-time 90 "$URL" -o assets/github-streak.svg
          if grep -qiE 'Failed to retrieve|Something went wrong' assets/github-streak.svg; then
            echo 'Streak API returned an error'
            exit 1
          fi
          # GitHub Camo does not run CSS animations; force full opacity for static display
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('assets/github-streak.svg')
          svg = p.read_text(encoding='utf-8')
          svg = re.sub(r'<style>[\s\S]*?</style>', '', svg)
          svg = re.sub(r'style="[^"]*opacity:\s*0[^"]*"', 'style="opacity: 1"', svg)
          svg = re.sub(r"style='[^']*opacity:\s*0[^']*'", "style='opacity: 1'", svg)
          svg = re.sub(r'animation:[^;"\']+;?', '', svg)
          p.write_text(svg, encoding='utf-8')
          PY
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -o assets/github-streak.png assets/github-streak.svg

      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-streak.svg assets/github-streak.png
          if git diff --staged --quiet; then
            echo 'No streak changes'
          else
            git commit -m "chore: refresh github streak card"
            git push
          fi
